<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | CampusVoice</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark"><i class="fa-solid fa-graduation-cap"></i></span> CampusVoice</div>
    <nav class="sidebar-nav">
      <a href="admin-dashboard.html" data-page="admin-dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
      <a href="admin-complaints.html" data-page="admin-complaints.html"><i class="fa-solid fa-list-check"></i> Complaints</a>
      <a href="admin-students.html" data-page="admin-students.html"><i class="fa-solid fa-user-graduate"></i> Students</a>
    </nav>
    <div class="sidebar-user">
      <div class="who">
        <div class="avatar" id="sidebar-avatar">A</div>
        <div>
          <div class="name" id="sidebar-name">Administrator</div>
          <div class="role">Admin Account</div>
        </div>
      </div>
      <button class="btn btn-ghost btn-sm btn-block" id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
    </div>
  </aside>
  <div class="overlay"></div>

  <div class="main-content">
    <div class="topbar">
      <button class="hamburger" aria-label="Toggle menu"><i class="fa-solid fa-bars"></i></button>
      <h1>Admin Dashboard</h1>
      <a href="admin-complaints.html" class="btn btn-accent btn-sm"><i class="fa-solid fa-list-check"></i> Manage Complaints</a>
    </div>

    <div class="page-body">
      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-icon total"><i class="fa-solid fa-clipboard-list"></i></div>
          <div><div class="stat-num" id="stat-total">0</div><div class="stat-label">Total Complaints</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon pending"><i class="fa-solid fa-hourglass-half"></i></div>
          <div><div class="stat-num" id="stat-pending">0</div><div class="stat-label">Pending</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon progress"><i class="fa-solid fa-spinner"></i></div>
          <div><div class="stat-num" id="stat-progress">0</div><div class="stat-label">In Progress</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon resolved"><i class="fa-solid fa-circle-check"></i></div>
          <div><div class="stat-num" id="stat-resolved">0</div><div class="stat-label">Resolved</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon rejected"><i class="fa-solid fa-circle-xmark"></i></div>
          <div><div class="stat-num" id="stat-rejected">0</div><div class="stat-label">Rejected</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon students"><i class="fa-solid fa-user-graduate"></i></div>
          <div><div class="stat-num" id="stat-students">0</div><div class="stat-label">Registered Students</div></div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>Recent Complaints</h2>
          <a href="admin-complaints.html" class="btn btn-outline btn-sm">View All</a>
        </div>
        <div class="panel-body" id="recent-complaints"></div>
      </div>
    </div>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const session = requireAdminAuth();
    if (!session) return;

    document.getElementById("sidebar-name").textContent = session.username;

    const stats = getAdminStats();
    document.getElementById("stat-total").textContent = stats.total;
    document.getElementById("stat-pending").textContent = stats.pending;
    document.getElementById("stat-progress").textContent = stats.inProgress;
    document.getElementById("stat-resolved").textContent = stats.resolved;
    document.getElementById("stat-rejected").textContent = stats.rejected;
    document.getElementById("stat-students").textContent = stats.totalStudents;

    const complaints = getAllComplaints();
    renderAdminRecentTable(document.getElementById("recent-complaints"), complaints, 6);

    document.getElementById("logout-btn").addEventListener("click", logoutAdmin);
  });
</script>
</body>
</html>
