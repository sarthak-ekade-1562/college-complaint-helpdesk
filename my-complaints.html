<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Complaints | CampusVoice</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark"><i class="fa-solid fa-graduation-cap"></i></span> CampusVoice</div>
    <nav class="sidebar-nav">
      <a href="student-dashboard.html" data-page="student-dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
      <a href="submit-complaint.html" data-page="submit-complaint.html"><i class="fa-solid fa-file-circle-plus"></i> Submit Complaint</a>
      <a href="my-complaints.html" data-page="my-complaints.html"><i class="fa-solid fa-list-check"></i> My Complaints</a>
    </nav>
    <div class="sidebar-user">
      <div class="who">
        <div class="avatar" id="sidebar-avatar">?</div>
        <div>
          <div class="name" id="sidebar-name">Loading...</div>
          <div class="role" id="sidebar-roll">-</div>
        </div>
      </div>
      <button class="btn btn-ghost btn-sm btn-block" id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
    </div>
  </aside>
  <div class="overlay"></div>

  <div class="main-content">
    <div class="topbar">
      <button class="hamburger" aria-label="Toggle menu"><i class="fa-solid fa-bars"></i></button>
      <h1>My Complaints</h1>
      <a href="submit-complaint.html" class="btn btn-accent btn-sm"><i class="fa-solid fa-plus"></i> New Complaint</a>
    </div>

    <div class="page-body">
      <div id="complaints-list"></div>
    </div>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/auth.js"></script>
<script src="js/student.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const student = requireStudentAuth();
    if (!student) return;

    document.getElementById("sidebar-avatar").textContent = getInitials(student.fullName);
    document.getElementById("sidebar-name").textContent = student.fullName;
    document.getElementById("sidebar-roll").textContent = student.rollNumber;
    document.getElementById("logout-btn").addEventListener("click", logoutStudent);

    const complaints = getStudentComplaints(student.id);
    renderMyComplaintsList(document.getElementById("complaints-list"), complaints);
  });
</script>
</body>
</html>
