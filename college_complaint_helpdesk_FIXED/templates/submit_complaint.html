{% extends "base.html" %}
{% block title %}Submit Complaint - College Helpdesk{% endblock %}
{% block page_title %}Submit Complaint{% endblock %}
{% block content %}

<div class="form-card">
  <h4 class="mb-3"><i class="fa-solid fa-circle-plus"></i> New Complaint</h4>

  <form method="POST" enctype="multipart/form-data" novalidate>
    <div class="mb-3">
      <label class="form-label">Complaint Title</label>
      <input type="text" name="title" class="form-control" required minlength="3"
             placeholder="e.g. Wi-Fi not working in Room 204" value="{{ form.get('title', '') }}">
    </div>

    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Category</label>
        <select name="category" class="form-select" required>
          <option value="" disabled {{ 'selected' if not form.get('category') }}>Select category</option>
          {% for cat in categories %}
          <option value="{{ cat }}" {{ 'selected' if form.get('category') == cat }}>{{ cat }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Location</label>
        <input type="text" name="location" class="form-control" required
               placeholder="e.g. Block A, Room 204" value="{{ form.get('location', '') }}">
      </div>
    </div>

    <div class="mb-3 mt-3">
      <label class="form-label">Description</label>
      <textarea name="description" class="form-control" rows="5" required minlength="10"
                placeholder="Describe the issue in detail...">{{ form.get('description', '') }}</textarea>
    </div>

    <div class="mb-3">
      <label class="form-label">Attachment (optional)</label>
      <input type="file" name="attachment" class="form-control" accept=".png,.jpg,.jpeg,.gif,.pdf">
      <small class="text-muted">Image or PDF, max 5 MB.</small>
    </div>

    <button type="submit" class="btn btn-primary">
      <i class="fa-solid fa-paper-plane"></i> Submit Complaint
    </button>
    <a href="{{ url_for('student_dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
  </form>
</div>

{% endblock %}
