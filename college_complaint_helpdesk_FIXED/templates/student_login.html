{% extends "base.html" %}
{% block title %}Student Login - College Helpdesk{% endblock %}
{% block public_content %}

<div class="auth-card auth-card-sm mx-auto">
  <h2 class="auth-title"><i class="fa-solid fa-user-graduate"></i> Student Login</h2>
  <p class="text-muted">Login with your registered email or roll number.</p>

  <form method="POST" novalidate>
    <div class="mb-3">
      <label class="form-label">Email or Roll Number</label>
      <input type="text" name="identifier" class="form-control" required autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" name="password" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Login</button>
  </form>

  <p class="text-center mt-3">
    New here? <a href="{{ url_for('register') }}">Register now</a>
  </p>
  <p class="text-center">
    <a href="{{ url_for('admin_login') }}"><i class="fa-solid fa-user-shield"></i> Login as Admin instead</a>
  </p>
</div>

{% endblock %}
