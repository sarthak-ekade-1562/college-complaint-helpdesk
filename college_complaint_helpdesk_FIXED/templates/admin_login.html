{% extends "base.html" %}
{% block title %}Admin Login - College Helpdesk{% endblock %}
{% block public_content %}

<div class="auth-card auth-card-sm mx-auto">
  <h2 class="auth-title"><i class="fa-solid fa-user-shield"></i> Admin Login</h2>
  <p class="text-muted">Authorized personnel only.</p>

  <form method="POST" novalidate>
    <div class="mb-3">
      <label class="form-label">Username</label>
      <input type="text" name="username" class="form-control" required autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" name="password" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Login</button>
  </form>

  <p class="text-center mt-3">
    <a href="{{ url_for('student_login') }}"><i class="fa-solid fa-user-graduate"></i> Login as Student instead</a>
  </p>
</div>

{% endblock %}
