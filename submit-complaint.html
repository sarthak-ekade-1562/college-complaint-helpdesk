<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submit Complaint | CampusVoice</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark"><i class="fa-solid fa-graduation-cap"></i></span> CampusVoice</div>
    <nav class="sidebar-nav">
      <a href="student-dashboard.html" data-page="student-dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
      <a href="submit-complaint.html" data-page="submit-complaint.html"><i class="fa-solid fa-file-circle-plus"></i> Submit Complaint</a>
      <a href="my-complaints.html" data-page="my-complaints.html"><i class="fa-solid fa-list-check"></i> My Complaints</a>
    </nav>
    <div class="sidebar-user">
      <div class="who">
        <div class="avatar" id="sidebar-avatar">?</div>
        <div>
          <div class="name" id="sidebar-name">Loading...</div>
          <div class="role" id="sidebar-roll">-</div>
        </div>
      </div>
      <button class="btn btn-ghost btn-sm btn-block" id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
    </div>
  </aside>
  <div class="overlay"></div>

  <div class="main-content">
    <div class="topbar">
      <button class="hamburger" aria-label="Toggle menu"><i class="fa-solid fa-bars"></i></button>
      <h1>Submit a Complaint</h1>
      <div></div>
    </div>

    <div class="page-body">
      <div class="panel" style="max-width:680px;">
        <div class="panel-head"><h2>Complaint Details</h2></div>
        <div class="panel-body">
          <div id="submit-alert" class="alert"></div>

          <form id="complaint-form" novalidate>
            <div class="form-group">
              <label for="title">Complaint Title</label>
              <input type="text" id="title" placeholder="e.g. Wi-Fi not working in Room 204" required>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="category">Category</label>
                <select id="category" required>
                  <option value="" disabled selected>Select category</option>
                </select>
              </div>
              <div class="form-group">
                <label for="priority">Priority</label>
                <select id="priority" required>
                  <option value="" disabled selected>Select priority</option>
                  <option>Low</option>
                  <option>Medium</option>
                  <option>High</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label for="location">Location</label>
              <input type="text" id="location" placeholder="e.g. Second Floor, Room 204" required>
            </div>

            <div class="form-group">
              <label for="description">Description</label>
              <textarea id="description" placeholder="Describe the issue in detail..." required></textarea>
              <div class="field-hint">Include when the issue started and how it affects you, if relevant.</div>
            </div>

            <button type="submit" class="btn btn-primary btn-block">
              <i class="fa-solid fa-paper-plane"></i> Submit Complaint
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/auth.js"></script>
<script src="js/student.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const student = requireStudentAuth();
    if (!student) return;

    document.getElementById("sidebar-avatar").textContent = getInitials(student.fullName);
    document.getElementById("sidebar-name").textContent = student.fullName;
    document.getElementById("sidebar-roll").textContent = student.rollNumber;
    document.getElementById("logout-btn").addEventListener("click", logoutStudent);

    const categorySelect = document.getElementById("category");
    CATEGORIES.forEach(cat => {
      const opt = document.createElement("option");
      opt.value = cat;
      opt.textContent = cat;
      categorySelect.appendChild(opt);
    });

    const form = document.getElementById("complaint-form");
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      hideAlert("submit-alert");

      const title = document.getElementById("title").value.trim();
      const category = document.getElementById("category").value;
      const priority = document.getElementById("priority").value;
      const location = document.getElementById("location").value.trim();
      const description = document.getElementById("description").value.trim();

      if (!title || !category || !priority || !location || !description) {
        showAlert("submit-alert", "Please fill in every field before submitting.", "error");
        return;
      }

      const complaint = submitComplaint(student, { title, category, priority, location, description });
      showToast(`Complaint ${complaint.complaintId} submitted successfully.`, "success");
      setTimeout(() => { window.location.href = "my-complaints.html"; }, 700);
    });
  });
</script>
</body>
</html>
